name: wawa_qhali
description: "Wawa Qhali: orientación ante ronchas en niños de 1 a 4 años."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  google_fonts: ^8.2.1
  google_mlkit_face_detection: ^1.0.3
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  pointycastle: ^4.0.0
  tflite_flutter: ^0.12.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db.json
    - assets/preguntas.json
    - assets/modelo/
