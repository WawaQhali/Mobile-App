name: APK

# CI de la app: pruebas en cada PR y push; en main (o a mano) compila el APK apuntando
# al backend de Azure y lo deja como artefacto descargable en la pestaña Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.2"
  API_URL: ${{ vars.API_URL || 'https://wawa-backend.salmonforest-a5ba81d5.centralus.azurecontainerapps.io' }}

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Sin --dart-define=API_URL, la prueba contra el backend real se omite.
      - run: flutter test

  apk:
    needs: pruebas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar el APK
        run: flutter build apk --release --dart-define=API_URL="$API_URL"
      - name: Nombre del APK
        id: nombre
        run: echo "archivo=wawa-qhali-$(git rev-parse --short=8 HEAD).apk" >> "$GITHUB_OUTPUT"
      - run: mv build/app/outputs/flutter-apk/app-release.apk "${{ steps.nombre.outputs.archivo }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.nombre.outputs.archivo }}
          path: ${{ steps.nombre.outputs.archivo }}
          retention-days: 30
